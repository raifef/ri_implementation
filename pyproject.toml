version = "0.12.0"
description = "Staged physics-informed calibration during quantum error correction"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "stim>=1.16,<2",
    "pymatching>=2.4,<3",
    "matplotlib>=3.8,<4",
]

