[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "google-rl-reimplementation"
version = "1.0.0"
description = "Standalone reimplementation and scientific validation workflow for detector-driven quantum error-correction reinforcement learning"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "stim>=1.16,<2",
    "pymatching>=2.4,<3",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
google-rl-bootstrap = "google_rl_reimplementation.bootstrap:main"
google-rl-audit = "google_rl_reimplementation.google_rl_certification.cli:audit_main"
google-rl-certify-high-shot = "google_rl_reimplementation.google_rl_certification.cli:high_shot_main"
